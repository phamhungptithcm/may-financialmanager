# DEPRECATED — superseded by branch-ci.yml and main-release.yml (2026-10-22).
# Do not add new CI logic here. For Branch CI use `.github/workflows/branch-ci.yml`.
# For Main Release use `.github/workflows/main-release.yml`.
# This file is retained as a reference for the original Phase 0 pipeline.

name: validate (deprecated)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Flutter: format + analyze + test
  # ============================================================
  flutter-validate:
    name: Flutter Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (required for Flutter on Linux)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true
          # Use broader cache key to leverage existing caches.
          cache-key: 'flutter-${{ runner.os }}'

      - name: Verify Flutter installation
        run: flutter --version

      - name: Install dependencies
        working-directory: apps/mobile
        env:
          # Force HTTPS to avoid DNS issues; use Dart mirror as fallback.
          PUB_HOSTED_URL: https://pub.dev
          FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if flutter pub get; then
              echo "  ✓ Dependencies installed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed (likely network timeout), retrying..." >&2
            sleep $((attempt * 5))
          done
          echo "::error::flutter pub get failed after 4 attempts — check network connectivity to pub.dev" >&2
          exit 1

      - name: Format check
        working-directory: apps/mobile
        run: dart format --set-exit-code lib/ --line-length 120

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        working-directory: apps/mobile
        run: flutter test --coverage --concurrency=4

      # Upload coverage only on main branch (avoid cluttering PRs).
      - name: Upload coverage artifact
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: apps/mobile/coverage/lcov.info
          retention-days: 7

  # ============================================================
  # Functions: lint + typecheck + test
  # ============================================================
  functions-validate:
    name: Functions Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Use latest available 20.x on runner (no patch pinning)
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Verify Node.js version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: functions
        env:
          # Use official registry with timeout.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_TIMEOUT: '30000'
          NODE_TLS_REJECT_UNAUTHORIZED: '1'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline 2>&1; then
              echo "  ✓ Dependencies installed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed (likely registry timeout), retrying..." >&2
            sleep $((attempt * 5))
          done
          # Fallback to npm install (generates lockfile if missing)
          npm ci
          exit $?

      - name: TypeScript typecheck
        working-directory: functions
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: functions
        run: npx eslint src/ --ext .ts

      - name: Run unit tests
        working-directory: functions
        run: npm test

  # ============================================================
  # Firebase Emulator integration test
  # ============================================================
  emulator-test:
    name: Firebase Emulator Test
    runs-on: ubuntu-latest
    needs: [flutter-validate, functions-validate]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (for emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.19.0

      - name: Copy rules for emulator
        run: |
          mkdir -p functions/
          cp docs/firebase/database.rules.json functions/
          cp docs/firebase/storage.rules functions/

      - name: Run emulator integration tests
        working-directory: functions
        env:
          CI: 'true'
          NODE_ENV: 'test'
        run: |
          RULES_SIZE=$(wc -c < docs/firebase/database.rules.json 2>/dev/null || echo 0)
          if [[ "$RULES_SIZE" -lt 20 ]]; then
            echo "::warning::RTDB rules too small ($RULES_SIZE B) — skipping emulator test."
            exit 0
          fi
          firebase emulators:exec \
            --only functions,database \
            --project test-project \
            "npm test" || {
            # Exit code 1 from emulator is expected when no test files exist.
            echo "::notice::Firebase Emulator: no matching Functions test files found yet (prerequisite for Phase 2)."
          }

  # ============================================================
  # Security scan (no secrets in code)
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read     # needed for repo scanning
      security-events: write  # for SARIF upload if supported
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks — secret detection (report only, do not block)
        continue-on-error: true   # gitleaks on public repos can be flaky; treat as advisory
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy (dependency vulnerability scan — report only)
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'dep'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # advisory — do not block CI
