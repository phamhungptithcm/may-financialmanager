# DEPRECATED — superseded by branch-ci.yml and main-release.yml (2026-10-22).
# Do not add new CI logic here. For Branch CI use `.github/workflows/branch-ci.yml`.
# For Main Release use `.github/workflows/main-release.yml`.
# This file is retained as a reference for the original Phase 0 pipeline.

name: validate (deprecated)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ============================================================
  # Flutter: format + analyze + test
  # ============================================================
  flutter-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check
        working-directory: apps/mobile
        run: dart format --set-exit-code lib/ --line-length 120

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        working-directory: apps/mobile
        run: flutter test --coverage --concurrency=4

  # ============================================================
  # Functions: lint + typecheck + test
  # ============================================================
  functions-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript typecheck
        working-directory: functions
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: functions
        run: npx eslint src/ --ext .ts

      - name: Run unit tests
        working-directory: functions
        run: npm test

  # ============================================================
  # Firebase Emulator integration test
  # ============================================================
  emulator-test:
    runs-on: ubuntu-latest
    needs: [flutter-validate, functions-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Set up Java (for emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flutter (for integration_test)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Setup Firebase (staging keys from env)
        run: |
          echo '${{ secrets.FIREBASE_STAGING_CONFIG }}' > functions/firebase-config.json
          # Copy rules files into the functions directory for emulator use.
          cp docs/firebase/database.rules.json functions/
          cp docs/firebase/storage.rules functions/

      - name: Run emulator tests
        working-directory: functions
        run: |
          firebase emulators:exec \
            --only functions,auth,database,storage \
            --project may-staging \
            "npm test"
        env:
          CI: 'true'
          NODE_ENV: 'test'

  # ============================================================
  # Security scan (no secrets in code)
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (dependency scan)
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
