# ============================================================
# Mây Family Finance — Reusable Quality Gates
# ============================================================
# Standalone workflow (not a composite action) that runs all
# mandatory quality checks shared between Branch CI and Main
# Release.  Intended to be called from other workflows via
# `workflow_call` or executed independently for auditing.

name: Reusable Quality Gates

on:
  workflow_call:

permissions: {}  # minimal — each job adds only what it needs

jobs:
  # ===========================================================
  # Flutter — format, analyze, test
  # ===========================================================
  flutter-validate:
    name: Flutter (format + analyze + test)
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    outputs:
      test-results: ${{ steps.coverage.outputs.passed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 (for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.24-x-${{ runner.os }}'

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check (line-length 120)
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed lib/ --line-length 120

      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run unit tests (with coverage)
        id: coverage
        working-directory: apps/mobile
        run: |
          flutter test --coverage --concurrency=4
          COVERAGE=$(ls coverage/lcov.info 2>/dev/null && echo "yes" || echo "no")
          echo "passed=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: apps/mobile/coverage/lcov.info
          retention-days: 14

  # ===========================================================
  # Functions — lint, typecheck, unit test
  # ===========================================================
  functions-validate:
    name: Functions (lint + typecheck + test)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript type-check
        working-directory: functions
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: functions
        run: npx eslint src/ --ext .ts

      - name: Run unit tests
        working-directory: functions
        run: npm test

      - name: Build production bundle
        working-directory: functions
        run: npm run build

  # ===========================================================
  # Firebase Emulator integration test
  # ===========================================================
  emulator-test:
    name: Firebase Emulator integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [functions-validate]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21 (for emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.19.0

      - name: Copy rules for emulator
        run: |
          mkdir -p functions/
          cp docs/firebase/database.rules.json functions/
          cp docs/firebase/storage.rules functions/

      - name: Run emulator integration tests
        working-directory: functions
        env:
          CI: 'true'
          NODE_ENV: 'test'
          FIREBASE_PROJECT: 'test-project'
        run: |
          RULES_SIZE=$(wc -c < docs/firebase/database.rules.json || echo 0)
          if [[ "$RULES_SIZE" -lt 20 ]]; then
            echo "::warning::RTDB rules too small ($RULES_SIZE B) — skipping emulator test."
            exit 0
          fi
          firebase emulators:exec \
            --only functions,database \
            --project "$FIREBASE_PROJECT" \
            "npm test" || {
            local exit_code=$?
            # Distinguish "no tests found" from actual failure.
            if [ $exit_code -eq 1 ]; then
              echo "::notice::Firebase Emulator: no matching test files found yet."
              exit 0
            fi
            echo "::error::Firebase Emulator test failed with exit code $exit_code" >&2
            exit $exit_code
          }

  # ===========================================================
  # Security scan
  # ===========================================================
  security-scan:
    name: Security scan (gitleaks + trivy)
    permissions:
      contents: read
      packages: read     # needed for trivy-action to download binary from GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks — secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trivy filesystem scan — advisory in public repos (inline).
      - name: Trivy (filesystem scan)
        continue-on-error: true
        env:
          TRIVY_DB_REPOSITORY: 'ghcr.io/trivy/standard-db'
          TRIVY_JAVA_DB_REPOSITORY: 'ghcr.io/trivy/java-db'
        run: |
          if command -v trivy &> /dev/null; then
            echo "::notice::Trivy already installed"
          elif command -v curl &> /dev/null; then
            echo "Installing Trivy..."
            curl -sL https://raw.githubusercontent.com/aquasecurity/trivy/main/packaging/install.sh | bash
          else
            echo "::notice::Trivy: no curl or pre-installed trivy — skipping filesystem scan"
            exit 0
          fi
          if ! command -v trivy &> /dev/null; then
            echo "::notice::Trivy: install failed — skipping filesystem scan"
            exit 0
          fi
          TRIVY_EXIT=0
          trivy fs --severity CRITICAL,HIGH --exit-code 0 --format table . || TRIVY_EXIT=$?
          if [ $TRIVY_EXIT -eq 0 ]; then
            echo "::notice::Trivy: filesystem scan passed (advisory)"
          else
            echo "::warning::Trivy: found CRITICAL/HIGH findings (exit code $TRIVY_EXIT, advisory mode)"
          fi

      # Trivy dependency scan — advisory only (inline).
      - name: Trivy (dependency scan)
        continue-on-error: true
        run: |
          if ! command -v trivy &> /dev/null; then
            echo "::notice::Trivy not available — skipping dependency scan"
            exit 0
          fi
          TRIVY_EXIT=0
          trivy dep --severity CRITICAL,HIGH --exit-code 0 . || TRIVY_EXIT=$?
          if [ $TRIVY_EXIT -eq 0 ]; then
            echo "::notice::Trivy: dependency scan passed (advisory)"
          else
            echo "::warning::Trivy: found CRITICAL/HIGH dependencies (exit code $TRIVY_EXIT, advisory mode)"
          fi
