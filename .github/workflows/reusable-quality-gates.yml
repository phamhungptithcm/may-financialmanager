# ============================================================
# Mây Family Finance — Reusable Quality Gates
# ============================================================
# Standalone workflow (not a composite action) that runs all
# mandatory quality checks shared between Branch CI and Main
# Release.  Intended to be called from other workflows via
# `workflow_call` or executed independently for auditing.
#
# Triggers: workflow_call
# Inputs:   none (repo state is read directly)
# Jobs:     flutter-validate | functions-validate | emulator-test | security-scan

name: Reusable Quality Gates

on:
  workflow_call:

jobs:
  # ===========================================================
  # Flutter — format, analyze, test
  # ===========================================================
  flutter-validate:
    name: Flutter (format + analyze + test)
    runs-on: ubuntu-latest
    outputs:
      test-results: ${{ steps.coverage.outputs.passed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for version calculation

      - name: Setup Java 17 (for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.24-x-${{ runner.os }}'

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format check (line-length 120)
        working-directory: apps/mobile
        run: dart format --set-exit-code lib/ --line-length 120

      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests (with coverage)
        id: coverage
        working-directory: apps/mobile
        run: |
          flutter test --coverage --concurrency=4
          COVERAGE=$(ls coverage/lcov.info 2>/dev/null && echo "yes" || echo "no")
          echo "passed=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: apps/mobile/coverage/lcov.info
          retention-days: 14

  # ===========================================================
  # Functions — lint, typecheck, unit test
  # ===========================================================
  functions-validate:
    name: Functions (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: TypeScript type-check
        working-directory: functions
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: functions
        run: npx eslint src/ --ext .ts

      - name: Run unit tests
        working-directory: functions
        run: npm test

      - name: Build production bundle
        working-directory: functions
        run: npm run build

  # ===========================================================
  # Firebase Emulator integration test
  # ===========================================================
  emulator-test:
    name: Firebase Emulator integration
    runs-on: ubuntu-latest
    needs: [functions-validate]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21 (for emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.19.0

      - name: Copy rules for emulator
        run: |
          mkdir -p functions/
          cp docs/firebase/database.rules.json functions/
          cp docs/firebase/storage.rules functions/

      - name: Run emulator integration tests
        working-directory: functions
        env:
          CI: 'true'
          NODE_ENV: 'test'
          FIREBASE_PROJECT: 'test-project'
        run: |
          # Only run if rules exist and are non-trivial.
          RULES_SIZE=$(wc -c < docs/firebase/database.rules.json || echo 0)
          if [[ "$RULES_SIZE" -lt 20 ]]; then
            echo "::warning::RTDB rules too small ($RULES_SIZE B) — skipping emulator test."
            exit 0
          fi
          firebase emulators:exec \
            --only functions,database \
            --project "$FIREBASE_PROJECT" \
            "npm test" || {
            # Exit code 1 from emulator is expected when no test files exist.
            echo "::notice::Firebase Emulator: no matching test files found (prerequisite for Phase 2)."
          }

  # ===========================================================
  # Security scan
  # ===========================================================
  security-scan:
    name: Security scan (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks — secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Trivy — dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: 'dep'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # report-only; do not block on deps yet
