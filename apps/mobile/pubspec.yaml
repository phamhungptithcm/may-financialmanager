name: may
description: "Mây Family Finance — iOS/Android personal & household budgeting."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0 <4.0.0'

dependencies:
  # Core Flutter SDK packages (already bundled)
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Internationalization
  intl: ^0.20.3

  # Firebase (production)
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_functions: ^7.0.0
  firebase_database: ^13.0.0
  firebase_storage: ^14.0.0
  firebase_app_check: ^0.5.0
  firebase_messaging: ^17.0.0

  # Utility
  uuid: ^4.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.4.4
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  custom_lint: ^0.6.0

flutter:
  uses-material-design: true
